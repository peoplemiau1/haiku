name: Build Haiku

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jam gcc g++ bison flex texinfo autoconf automake gawk nasm wget unzip xorriso mtools python3

      - name: Cache cross-tools
        uses: actions/cache@v4
        with:
          path: generated.x86_64
          key: ${{ runner.os }}-cross-tools-${{ hashFiles('buildtools/**') }}
          restore-keys: |
            ${{ runner.os }}-cross-tools-

      - name: Checkout buildtools
        uses: actions/checkout@v4
        with:
          repository: haiku/buildtools
          path: buildtools

      # Note: Building full Haiku exceeds GitHub Action time limits (6h)
      - name: Configure and Build
        run: |
          if [ ! -d "generated.x86_64" ]; then
            mkdir generated.x86_64
            cd generated.x86_64
            ../configure --cross-tools-source ../buildtools --build-cross-tools x86_64
          else
            echo "Using cached cross-tools."
          fi
          cd generated.x86_64
          jam -q @nightly-raw

